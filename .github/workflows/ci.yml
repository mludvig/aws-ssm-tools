name: CI/CD

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

# Only the release job writes, see docs/adr/0017-release-pipeline.md
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    env:
      # Overrides .python-version, otherwise every matrix job runs on 3.12
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: ./dev.sh install

    - name: Run code quality checks
      run: ./dev.sh check

    - name: Run tests
      run: |
        uv run python -VV
        ./dev.sh test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: ./dev.sh install

    - name: Build package
      run: ./dev.sh build

    - name: Upload build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/

  build-windows:
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

    - name: Set up Python
      run: uv python install 3.12

    - name: Install package and PyInstaller
      run: uv sync --locked --no-dev --group windows

    - name: Build executables
      run: |
        # Generate entry-point stubs (needed so PyInstaller resolves relative imports correctly)
        $tools = @(
          @{ stub = "_entry_ec2_session.py";      module = "ssm_tools.ssm_session_cli" },
          @{ stub = "_entry_ec2_ssh.py";          module = "ssm_tools.ssm_ssh_cli" },
          @{ stub = "_entry_ecs_session.py";      module = "ssm_tools.ecs_session_cli" },
          @{ stub = "_entry_ssm_port_forward.py"; module = "ssm_tools.ssm_port_forward_cli" }
        )
        foreach ($tool in $tools) {
          $lines = @(
            "import sys",
            "from ssm_tools.startup import Spinner",
            "with Spinner():",
            "    from $($tool.module) import main",
            "if __name__ == '__main__':",
            "    sys.exit(main())"
          )
          $lines -join "`n" | Set-Content $tool.stub
        }
        uv run --no-sync pyinstaller aws-ssm-tools.spec
        if ($LASTEXITCODE -ne 0) { throw "pyinstaller failed with $LASTEXITCODE" }
        foreach ($tool in $tools) { Remove-Item $tool.stub }
      shell: pwsh

    - name: Smoke test executables
      run: |
        $dist = "dist\aws-ssm-tools"
        foreach ($exe in Get-ChildItem "$dist\*.exe") {
          foreach ($option in "--version", "--help") {
            & $exe.FullName $option > $null
            if ($LASTEXITCODE -ne 0) { throw "$($exe.Name) $option failed with $LASTEXITCODE" }
          }
        }
        "OK: $((Get-ChildItem "$dist\*.exe").Name -join ', ')"
      shell: pwsh

    - name: Create zip bundle
      run: |
        $version = uv run --no-sync python -c "import ssm_tools; print(ssm_tools.__version__)"
        Compress-Archive -Path dist\aws-ssm-tools `
          -DestinationPath "dist\aws-ssm-tools-windows-$version.zip"
      shell: pwsh

    - name: Upload build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: windows-dist
        path: dist/

  # Publishes what build and build-windows tested, see docs/adr/0017-release-pipeline.md
  release:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release   # PyPI's trusted publisher is bound to it
    permissions:
      contents: write      # the GitHub release
      id-token: write      # the provenance attestation and PyPI Trusted Publishing
      attestations: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/

    - name: Download Windows build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: windows-dist
        path: windows/

    - name: Verify version matches tag
      id: version
      env:
        TAG: ${{ github.ref_name }}
      run: |
        # The wheel has the normalised version, e.g. aws_ssm_tools-3.0.0b1-py3-none-any.whl
        version=$(basename dist/*.whl | cut -d- -f2)
        echo "Tag: $TAG, package version: $version"
        if [ "$TAG" != "v$version" ]; then
          echo "Error: tag $TAG doesn't match the package version, it must be v$version"
          exit 1
        fi
        # 3.0.0b1, 3.0.0rc1 etc. are pre-releases
        if [[ $version =~ [a-z] ]]; then prerelease=true; else prerelease=false; fi
        echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

    - name: Collect release files and checksums
      run: |
        mkdir release
        cp dist/* windows/*.zip release/
        cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-checksums: release/SHA256SUMS

    - name: Create GitHub Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        files: release/*
        prerelease: ${{ steps.version.outputs.prerelease }}

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

    - name: Publish to PyPI
      run: uv publish --trusted-publishing always dist/*
